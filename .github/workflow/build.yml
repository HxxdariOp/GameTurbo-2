name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project PerfTool.xcodeproj \
            -scheme PerfTool \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Build root helper (ptroot)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -isysroot "$SDK" -arch arm64 -miphoneos-version-min=15.0 -O2 -I. \
            ptroot.c Bridge.c -framework CoreFoundation -o ptroot

      - name: Embed helper, fakesign with entitlements and package
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PerfTool.app Payload/
          cp ptroot Payload/PerfTool.app/ptroot
          chmod 755 Payload/PerfTool.app/ptroot
          ldid -Sentitlements.plist Payload/PerfTool.app/ptroot
          ldid -Sentitlements.plist Payload/PerfTool.app/PerfTool
          zip -r PerfTool.ipa Payload
          cp PerfTool.ipa PerfTool.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: PerfTool-ipa
          path: |
            PerfTool.ipa
            PerfTool.tipa
